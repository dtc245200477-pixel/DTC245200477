networks:
  frontend_net:
    driver: bridge
  backend_net:
    internal: true

volumes:
  db_data:
  wp_data:

services:
  db:
    image: mysql:8.0
    container_name: news_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootSecurePasswd_2026!
      MYSQL_DATABASE: news_portal
      MYSQL_USER: news_admin
      MYSQL_PASSWORD: NewsDbUserPasswd_2026!
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net

  wordpress:
    image: wordpress:latest
    container_name: news_app
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: news_admin
      WORDPRESS_DB_PASSWORD: NewsDbUserPasswd_2026!
      WORDPRESS_DB_NAME: news_portal
    volumes:
      - wp_data:/var/www/html
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: news_pma
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://localhost/pma/
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: news_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend_net
    depends_on:
      - wordpress
      - phpmyadmin
